name: qcs Windows ACL diagnostic

on:
  push:
    branches: [codex/qcs-acl-probe]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Checkout diagnostic source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: 'qcs 源码'
          persist-credentials: false
      - name: Use the native acceptance Python version
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Observe effective token and isolated ACL behavior
        shell: pwsh
        working-directory: 'qcs 源码'
        env:
          PYTHONUTF8: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          $reportRoot = Join-Path $env:RUNNER_TEMP ('qcs-acl-' + $env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Path $reportRoot -ErrorAction Stop | Out-Null
          $env:QCOPILOTS_SEARCH_TEST_ROOT = $reportRoot
          python -X utf8 -B tools/acceptance/qcs-acl-probe.py --output-root (Join-Path $reportRoot 'pwsh') *> (Join-Path $reportRoot 'pwsh.log')
          $probeExit = $LASTEXITCODE
          Get-Content -LiteralPath (Join-Path $reportRoot 'pwsh.log')
          exit $probeExit
      - name: Observe the same probe through Bash and PowerShell
        if: always()
        shell: bash
        working-directory: 'qcs 源码'
        env:
          PYTHONUTF8: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          pwsh -NoProfile -Command '$reportRoot = Join-Path $env:RUNNER_TEMP ("qcs-acl-" + $env:GITHUB_RUN_ID); python -X utf8 -B tools/acceptance/qcs-acl-probe.py --output-root (Join-Path $reportRoot "bash-pwsh") *> (Join-Path $reportRoot "bash-pwsh.log"); $probeExit = $LASTEXITCODE; Get-Content -LiteralPath (Join-Path $reportRoot "bash-pwsh.log"); exit $probeExit'
      - name: Observe Bash with an unchanged duplicate thread token
        if: always()
        shell: bash
        working-directory: 'qcs 源码'
        env:
          PYTHONUTF8: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          pwsh -NoProfile -Command '$reportRoot = Join-Path $env:RUNNER_TEMP ("qcs-acl-" + $env:GITHUB_RUN_ID); python -X utf8 -B tools/acceptance/qcs-acl-probe.py --probe-token duplicate-control --output-root (Join-Path $reportRoot "duplicate-control") *> (Join-Path $reportRoot "duplicate-control.log"); $probeExit = $LASTEXITCODE; Get-Content -LiteralPath (Join-Path $reportRoot "duplicate-control.log"); exit $probeExit'
      - name: Observe Bash with SeRestore disabled only on a duplicate token
        if: always()
        shell: bash
        working-directory: 'qcs 源码'
        env:
          PYTHONUTF8: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          pwsh -NoProfile -Command '$reportRoot = Join-Path $env:RUNNER_TEMP ("qcs-acl-" + $env:GITHUB_RUN_ID); python -X utf8 -B tools/acceptance/qcs-acl-probe.py --probe-token disable-restore --output-root (Join-Path $reportRoot "disable-restore") *> (Join-Path $reportRoot "disable-restore.log"); $probeExit = $LASTEXITCODE; Get-Content -LiteralPath (Join-Path $reportRoot "disable-restore.log"); exit $probeExit'
      - name: Exercise the fixed full acceptance suite through Bash and PowerShell
        if: always()
        shell: bash
        working-directory: 'qcs 源码'
        env:
          PYTHONUTF8: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          pwsh -NoProfile -Command '$reportRoot = Join-Path $env:RUNNER_TEMP ("qcs-acl-" + $env:GITHUB_RUN_ID); $env:QCOPILOTS_SEARCH_TEST_ROOT = Join-Path $reportRoot "fixed-tests"; New-Item -ItemType Directory -Path $env:QCOPILOTS_SEARCH_TEST_ROOT -ErrorAction Stop | Out-Null; python -X utf8 -B tools/acceptance/qcs-test-runners.py *> (Join-Path $reportRoot "fixed-suite.log"); $suiteExit = $LASTEXITCODE; @{exitCode=$suiteExit; candidate=$env:GITHUB_SHA} | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $reportRoot "fixed-suite-exit.json") -Encoding utf8; Get-Content -LiteralPath (Join-Path $reportRoot "fixed-suite.log"); exit $suiteExit'
      - name: Preserve original diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qcs-acl-probe-${{ github.sha }}
          path: ${{ runner.temp }}/qcs-acl-${{ github.run_id }}/
          if-no-files-found: error
          retention-days: 14
