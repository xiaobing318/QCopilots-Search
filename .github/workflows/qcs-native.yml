name: qcs native acceptance

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_profile:
        description: 'fast: daily checks, full: required release acceptance'
        type: choice
        required: true
        default: fast
        options: [fast, full]

env:
  QCOPILOTS_SEARCH_TEST_PROFILE: ${{ (github.event_name == 'push' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:full'))) && 'full' || inputs.test_profile || 'fast' }}

permissions:
  contents: read

concurrency:
  group: qcs-native-${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name == 'push' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:full'))) && 'full' || inputs.test_profile || 'fast' }}
  cancel-in-progress: true

jobs:
  native:
    name: qcs ${{ matrix.id }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            runner: windows-2022
            arch: x86_64
            generators: ZIP,NSIS
          - id: linux-x64
            runner: ubuntu-22.04
            arch: x86_64
            generators: TGZ,DEB
          - id: macos-arm64
            runner: macos-15
            arch: arm64
            generators: DragNDrop
          - id: macos-x64
            runner: macos-15-intel
            arch: x86_64
            generators: DragNDrop
    defaults:
      run:
        shell: bash
        working-directory: 'qcs 源码'
    env:
      QCOPILOTS_SEARCH_CI_ID: ${{ matrix.id }}
      QCOPILOTS_SEARCH_CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      QCOPILOTS_SEARCH_CI_ARCH: ${{ matrix.arch }}
      QCOPILOTS_SEARCH_CI_GENERATORS: ${{ matrix.generators }}
      QCOPILOTS_SEARCH_KEEP_FAILED_TESTS: '1'
    steps:
      - name: Checkout in a path containing Chinese and a space
        timeout-minutes: 10
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: 'qcs 源码'
          persist-credentials: false
      - name: Set up Python for developer tooling
        timeout-minutes: 10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Initialize isolated runner directories
        timeout-minutes: 5
        run: python .github/scripts/qcs-native-ci.py initialize
      - name: Install Linux host libraries and test display
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential ninja-build pkg-config dbus-daemon libxcb1-dev \
            libgl1-mesa-dev libxkbcommon-dev libfontconfig1-dev libfreetype6-dev \
            libglib2.0-dev libdbus-1-dev libx11-xcb-dev libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-shape0 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 libxkbcommon-x11-0 \
            libpulse0 xvfb xauth dpkg-dev patchelf fonts-noto-cjk fonts-dejavu-core
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        timeout-minutes: 15
        run: brew install ninja
      - name: Restore immutable model cache
        if: env.QCOPILOTS_SEARCH_TEST_PROFILE == 'full'
        timeout-minutes: 15
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.QCOPILOTS_SEARCH_MODEL_DIR }}
          key: qcs-models-bfcd298762cc34d0357ece5ebdd31791a3a374d8-v1
      - name: Bootstrap locked SDK
        timeout-minutes: 30
        run: python .github/scripts/qcs-native-ci.py bootstrap
      - name: Diagnose native toolchain
        timeout-minutes: 5
        run: python .github/scripts/qcs-native-ci.py doctor
      - name: Configure CPU baseline
        timeout-minutes: 30
        run: python .github/scripts/qcs-native-ci.py configure
      - name: Build
        timeout-minutes: 60
        run: python .github/scripts/qcs-native-ci.py build
      - name: Download and verify required real models
        if: env.QCOPILOTS_SEARCH_TEST_PROFILE == 'full'
        timeout-minutes: 35
        run: python .github/scripts/qcs-native-ci.py models
      - name: Run selected portable tests (full includes real-model and capacity tests)
        timeout-minutes: ${{ env.QCOPILOTS_SEARCH_TEST_PROFILE == 'full' && 180 || 45 }}
        run: python .github/scripts/qcs-native-ci.py test
      - name: Exercise the capacity path at CI scale
        if: env.QCOPILOTS_SEARCH_TEST_PROFILE == 'full'
        timeout-minutes: 20
        run: python .github/scripts/qcs-native-ci.py capacity
      - name: Install staging tree after automated tests pass
        if: env.QCOPILOTS_SEARCH_TEST_PROFILE == 'full'
        timeout-minutes: 15
        run: python .github/scripts/qcs-native-ci.py install
      - name: Package and verify deployment
        if: env.QCOPILOTS_SEARCH_TEST_PROFILE == 'full'
        timeout-minutes: 45
        run: python .github/scripts/qcs-native-ci.py package
      - name: Install and remove the final NSIS or DEB package
        if: env.QCOPILOTS_SEARCH_TEST_PROFILE == 'full' && (runner.os == 'Windows' || runner.os == 'Linux')
        timeout-minutes: 45
        run: python .github/scripts/qcs-native-ci.py installers
      - name: Collect corresponding source materials
        if: env.QCOPILOTS_SEARCH_TEST_PROFILE == 'full'
        timeout-minutes: 30
        run: python .github/scripts/qcs-native-ci.py sources
      - name: Record evidence for the selected profile
        if: always()
        timeout-minutes: 10
        run: python .github/scripts/qcs-native-ci.py report
      - name: Verify this native evidence unit
        timeout-minutes: 10
        run: python .github/scripts/qcs-native-ci.py preflight
      - name: Upload reports and test packages
        if: always() && env.QCOPILOTS_SEARCH_TEST_PROFILE == 'full'
        timeout-minutes: 20
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qcs-native-${{ matrix.id }}-${{ env.QCOPILOTS_SEARCH_CANDIDATE_HEAD }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ env.QCOPILOTS_SEARCH_BUILD_ROOT }}/reports
            ${{ env.QCOPILOTS_SEARCH_BUILD_ROOT }}/pkg/qcs-*
            ${{ env.QCOPILOTS_SEARCH_BUILD_ROOT }}/pkg/SHA256SUMS
            ${{ env.QCOPILOTS_SEARCH_BUILD_ROOT }}/pkg/_CPack_Packages/**/NSISOutput.log
            ${{ env.QCOPILOTS_SEARCH_BUILD_ROOT }}/pkg/_CPack_Packages/**/project.nsi
            ${{ env.QCOPILOTS_SEARCH_BUILD_ROOT }}/release/Testing/Temporary
            ${{ env.QCOPILOTS_SEARCH_BUILD_ROOT }}/release/CMakeFiles/CMakeConfigureLog.yaml
            ${{ env.QCOPILOTS_SEARCH_BUILD_ROOT }}/release/tests/**/qcs-tests-*.xml
            ${{ env.QCOPILOTS_SEARCH_BUILD_ROOT }}/runs/**/qcs-image-*/**
      - name: Upload daily fast reports (no release packages)
        if: always() && env.QCOPILOTS_SEARCH_TEST_PROFILE == 'fast'
        timeout-minutes: 15
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qcs-fast-${{ matrix.id }}-${{ env.QCOPILOTS_SEARCH_CANDIDATE_HEAD }}
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ env.QCOPILOTS_SEARCH_BUILD_ROOT }}/reports
            ${{ env.QCOPILOTS_SEARCH_BUILD_ROOT }}/release/Testing/Temporary
            ${{ env.QCOPILOTS_SEARCH_BUILD_ROOT }}/release/CMakeFiles/CMakeConfigureLog.yaml

  required:
    name: qcs all native combinations
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    if: always()
    needs: native
    steps:
      - name: Checkout candidate evidence validators
        timeout-minutes: 5
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        timeout-minutes: 5
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Download all four native evidence units
        if: env.QCOPILOTS_SEARCH_TEST_PROFILE == 'full'
        timeout-minutes: 15
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: qcs-native-*-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/qcs-native-artifacts
      - name: Aggregate native raw reports and immutable source identities
        if: always() && env.QCOPILOTS_SEARCH_TEST_PROFILE == 'full'
        timeout-minutes: 10
        shell: bash
        env:
          CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python tools/qcs-release-evidence.py aggregate-native \
            --candidate-commit "$CANDIDATE_HEAD" \
            --native-artifacts-dir "$RUNNER_TEMP/qcs-native-artifacts" \
            --output "$RUNNER_TEMP/qcs-native-aggregate.json"
      - name: Upload native aggregate report
        if: always() && env.QCOPILOTS_SEARCH_TEST_PROFILE == 'full'
        timeout-minutes: 5
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qcs-native-aggregate-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/qcs-native-aggregate.json
          if-no-files-found: error
      - name: Download all four daily fast evidence units
        if: env.QCOPILOTS_SEARCH_TEST_PROFILE == 'fast'
        timeout-minutes: 10
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: qcs-fast-*-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/qcs-fast-artifacts
      - name: Aggregate daily fast evidence (release acceptance remains incomplete)
        if: always() && env.QCOPILOTS_SEARCH_TEST_PROFILE == 'fast'
        timeout-minutes: 5
        shell: bash
        run: |
          python .github/scripts/qcs-native-ci.py aggregate-fast \
            --artifacts-dir "$RUNNER_TEMP/qcs-fast-artifacts" \
            --output "$RUNNER_TEMP/qcs-fast-aggregate.json"
      - name: Upload daily fast aggregate report
        if: always() && env.QCOPILOTS_SEARCH_TEST_PROFILE == 'fast'
        timeout-minutes: 5
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qcs-fast-aggregate-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/qcs-fast-aggregate.json
          if-no-files-found: error
      - name: Check all native jobs
        if: always()
        timeout-minutes: 1
        shell: bash
        env:
          NATIVE_RESULT: ${{ needs.native.result }}
        run: test "$NATIVE_RESULT" = success
