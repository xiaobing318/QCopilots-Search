name: qcs native acceptance

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qcs-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: qcs build configurations
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      configurations: ${{ steps.configurations.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Read the shared build variants
        id: configurations
        run: python3 .github/scripts/qcs-native-ci.py matrix

  native:
    name: qcs ${{ matrix.id }}
    needs: matrix
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.configurations) }}
    defaults:
      run:
        shell: bash
        working-directory: 'qcs 源码'
    env:
      QCOPILOTS_SEARCH_CI_ID: ${{ matrix.id }}
      QCOPILOTS_SEARCH_VARIANT: ${{ matrix.id }}
      QCOPILOTS_SEARCH_CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      QCOPILOTS_SEARCH_CI_CONTAINER: ${{ matrix.container != '' && '1' || '0' }}
      QCOPILOTS_SEARCH_CI_CONTAINER_IMAGE: ${{ matrix.container }}
      QCOPILOTS_SEARCH_KEEP_FAILED_TESTS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Prepare the pinned CUDA container
        if: matrix.container != ''
        timeout-minutes: 15
        working-directory: /
        run: |
          apt-get update
          apt-get install --no-install-recommends -y ca-certificates git curl tar gzip unzip python3 python3-venv passwd cmake
      - name: Checkout in a path containing Chinese and a space
        timeout-minutes: 10
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: 'qcs 源码'
          persist-credentials: false
      - name: Set up Python for developer tooling
        timeout-minutes: 10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Initialize isolated runner directories
        timeout-minutes: 5
        run: python .github/scripts/qcs-native-ci.py initialize
      - name: Install Linux host libraries and test display
        if: runner.os == 'Linux'
        timeout-minutes: 20
        run: |
          qcs_sudo=()
          if [ "$(id -u)" != 0 ]; then qcs_sudo=(sudo); fi
          "${qcs_sudo[@]}" apt-get update
          "${qcs_sudo[@]}" apt-get install --no-install-recommends -y build-essential ninja-build pkg-config dbus-daemon libxcb1-dev \
            libgl1-mesa-dev libxkbcommon-dev libfontconfig1-dev libfreetype6-dev \
            libglib2.0-dev libdbus-1-dev libx11-xcb-dev libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-shape0 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 libxkbcommon-x11-0 \
            libpulse0 xvfb xauth dpkg-dev patchelf fonts-noto-cjk fonts-dejavu-core \
            libvulkan-dev glslc spirv-headers
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        timeout-minutes: 15
        run: brew install ninja
      - name: Reuse the pinned upstream Windows CUDA SDK setup
        if: runner.os == 'Windows' && matrix.backend == 'cuda'
        timeout-minutes: 45
        uses: ggml-org/llama.cpp/.github/actions/windows-setup-cuda@4d756bc72bf00a4aacf410ae15a2d315f3db400d
        with:
          cuda_version: ${{ matrix.toolkitVersion }}
          cuda_arch: x64
      - name: Record Windows ROCm disk space before SDK setup
        if: runner.os == 'Windows' && matrix.backend == 'hip'
        shell: pwsh
        run: |
          $qcsDrive = Get-PSDrive -Name C
          Write-Output "ROCm SDK setup initial free bytes: $($qcsDrive.Free)"
      - name: Reuse the pinned upstream Windows ROCm SDK setup
        if: runner.os == 'Windows' && matrix.backend == 'hip'
        timeout-minutes: 45
        uses: ggml-org/llama.cpp/.github/actions/windows-setup-rocm@4d756bc72bf00a4aacf410ae15a2d315f3db400d
        env:
          PIP_NO_CACHE_DIR: '1'
        with:
          version: ${{ matrix.toolkitVersion }}
      - name: Record Windows ROCm disk space after SDK setup
        if: always() && runner.os == 'Windows' && matrix.backend == 'hip'
        shell: pwsh
        run: |
          $qcsDrive = Get-PSDrive -Name C
          Write-Output "ROCm SDK setup remaining free bytes: $($qcsDrive.Free)"
      - name: Select the upstream ROCm Python environment
        if: runner.os == 'Windows' && matrix.backend == 'hip'
        shell: pwsh
        run: |
          $qcsRocmPython = 'C:\TheRock\build\.venv\Scripts\python.exe'
          if (-not (Test-Path -LiteralPath $qcsRocmPython -PathType Leaf)) {
            throw 'The pinned upstream ROCm setup did not create its Python environment'
          }
          "QCOPILOTS_SEARCH_ROCM_PYTHON=$qcsRocmPython" >> $env:GITHUB_ENV
      - name: Restore immutable model cache
        timeout-minutes: 15
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.QCOPILOTS_SEARCH_MODEL_DIR }}
          key: qcs-models-bfcd298762cc34d0357ece5ebdd31791a3a374d8-v1
      - name: Bootstrap locked Qt and backend SDK
        timeout-minutes: 60
        run: python .github/scripts/qcs-native-ci.py bootstrap
      - name: Diagnose native toolchain and available hardware
        timeout-minutes: 10
        run: python .github/scripts/qcs-native-ci.py doctor
      - name: Configure selected backend
        timeout-minutes: 30
        run: python .github/scripts/qcs-native-ci.py configure
      - name: Build
        timeout-minutes: 120
        run: python .github/scripts/qcs-native-ci.py build
      - name: Download and verify required real models
        timeout-minutes: 35
        run: python .github/scripts/qcs-native-ci.py models
      - name: Run all functional and real-model numerical tests
        timeout-minutes: 90
        run: python .github/scripts/qcs-native-ci.py test
      - name: Install staging tree
        timeout-minutes: 20
        run: python .github/scripts/qcs-native-ci.py install
      - name: Package and verify portable deployment
        timeout-minutes: 45
        run: python .github/scripts/qcs-native-ci.py package
      - name: Install and remove the final installer
        if: runner.os == 'Windows' || runner.os == 'Linux'
        timeout-minutes: 45
        run: python .github/scripts/qcs-native-ci.py installers
      - name: Validate the exact user package set
        id: packages
        timeout-minutes: 10
        run: python .github/scripts/qcs-native-ci.py products
      - name: Upload installers and portable packages
        timeout-minutes: 20
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qcs-packages-${{ matrix.id }}-${{ env.QCOPILOTS_SEARCH_CANDIDATE_HEAD }}-attempt${{ github.run_attempt }}
          path: ${{ steps.packages.outputs.paths }}
          overwrite: false
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  required:
    name: qcs all native combinations
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: always()
    needs: [matrix, native]
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout candidate artifact selector
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify all required native jobs
        env:
          MATRIX_RESULT: ${{ needs.matrix.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
        run: test "$MATRIX_RESULT" = success && test "$NATIVE_RESULT" = success
      - name: Verify immutable package artifact identities
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 .github/scripts/qcs-artifact-selection.py collect \
            --output-dir "$RUNNER_TEMP/qcs-selected-artifacts" \
            --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" \
            --candidate-head "$CANDIDATE_HEAD" --attempt "$GITHUB_RUN_ATTEMPT"
